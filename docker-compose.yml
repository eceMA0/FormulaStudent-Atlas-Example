services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka-broker-1
    networks:
      - kafka_net
    ports:
      # Host port -> broker. This is the address Program.cs connects to.
      # Change the LEFT number only if 9094 is already taken on your machine.
      - "9094:9094"
    environment:
      CLUSTER_ID: 'dev-kafka-cluster'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # 9092 = other containers, 9093 = internal controller, 9094 = your PC
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # All set to 1 because this is a single-broker development cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-kafka-logs'

  # Optional web UI for inspecting topics and messages. Safe to delete.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-1
    networks:
      - kafka_net
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'dev-kafka-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka

networks:
  kafka_net:
    driver: bridge
